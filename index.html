<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopping List</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === Clean & Minimal Palette === */
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-sub: #757575;
            --accent: #8D6E63;
            --border: #E0E0E0;
            --tag-bg: #F5F5F5;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 50px;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Header --- */
        .header {
            background: var(--card-bg);
            padding: 20px 25px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .header h1 { margin: 0; font-size: 1.3rem; font-weight: 500; color: var(--text-main); }

        /* --- Search Bar --- */
        .search-container { margin-top: 15px; }
        .search-box {
            width: 100%; padding: 10px 15px; border: 1px solid var(--border); border-radius: 8px;
            font-family: 'Sarabun'; font-size: 0.95rem; background: #F9F9F9; outline: none; box-sizing: border-box;
        }
        .search-box:focus { background: #fff; border-color: var(--accent); }

        /* --- Main List Container --- */
        .container { max-width: 600px; margin: 20px auto; padding: 0 20px; }

        .group-header {
            margin-top: 30px; margin-bottom: 10px; color: var(--text-sub); font-weight: 500;
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid var(--border); padding-bottom: 5px;
        }

        /* --- Product Card (Grouped) --- */
        .item-card {
            background: var(--card-bg); border-radius: 8px; padding: 16px 20px; margin-bottom: 10px;
            border: 1px solid var(--border); cursor: pointer; transition: background 0.2s;
            display: flex; justify-content: space-between; align-items: center;
        }
        .item-card:active { background-color: #F5F5F5; }
        .item-name { font-size: 1rem; font-weight: 500; color: var(--text-main); }
        .item-count { background: var(--accent); color: white; font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 400; }

        /* --- Modal Styling --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box; backdrop-filter: blur(3px);
        }
        .modal.active { display: flex; }

        .modal-content {
            background: var(--card-bg); width: 100%; max-width: 500px; max-height: 85vh;
            border-radius: 12px; position: relative; display: flex; flex-direction: column;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #fff; }
        .modal-title { margin: 0; font-size: 1.2rem; font-weight: 600; color: var(--text-main); }
        
        .close-btn {
            background: #F0F0F0; border: none; width: 32px; height: 32px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: #555; font-size: 1rem; transition: background 0.2s;
        }
        .close-btn:hover { background: #E0E0E0; }

        .modal-body { padding: 20px; overflow-y: auto; }

        /* Variant Item Styling */
        .variant-item { display: flex; gap: 15px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f0f0f0; }
        .variant-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        /* Image Wrapper with Zoom Cursor */
        .variant-img-box {
            width: 80px; height: 80px; flex-shrink: 0; background: #f9f9f9;
            border-radius: 6px; overflow: hidden; position: relative;
            cursor: zoom-in;
            transition: opacity 0.2s;
        }
        .variant-img-box:hover { opacity: 0.8; }
        .variant-img { width: 100%; height: 100%; object-fit: cover; }
        
        .variant-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
        .badge { font-size: 0.8rem; background: var(--tag-bg); color: #555; padding: 4px 10px; border-radius: 4px; border: 1px solid #eee; }
        
        /* Price Styling (Updated) */
        .variant-price { 
            font-size: 1.1rem; 
            font-weight: 600; 
            color: var(--accent); 
            margin-top: auto;
            display: flex; 
            align-items: center; 
            flex-wrap: wrap;
            gap: 5px; 
            margin-bottom: 4px;
        }
        .thb-price { font-size: 0.9rem; color: #999; font-weight: 400; white-space: nowrap; }
        
        /* ✨ Style สำหรับ No Vat ✨ */
        .no-vat-price {
            font-size: 0.8rem;
            color: #3949ab; /* สีน้ำเงินเข้ม */
            font-weight: 400;
            white-space: nowrap;
            background: #e8eaf6;
            padding: 1px 6px;
            border-radius: 4px;
        }

        /* --- Remark Styling --- */
        .remark-container { width: 100%; display: block; margin-top: 2px; }
        .remark-badge {
            font-size: 0.75rem; color: #d84315; background: #fff3e0; 
            border: 1px solid #ffe0b2; padding: 2px 8px; border-radius: 4px;
            display: inline-block; line-height: 1.4;
        }
        .remark-badge i { font-size: 0.7rem; margin-right: 4px; opacity: 0.7; }

        /* --- Image Viewer Modal --- */
        .img-viewer-modal { background: rgba(0,0,0,0.95) !important; z-index: 1100; }
        .modal-full-img {
            max-width: 95%; max-height: 95vh; object-fit: contain;
            border-radius: 4px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: zoomIn 0.2s ease-out;
        }
        @keyframes zoomIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .close-btn-img {
            position: absolute; top: 20px; right: 20px; color: white;
            font-size: 2rem; cursor: pointer; z-index: 1200; opacity: 0.8;
        }
        .close-btn-img:hover { opacity: 1; }

        /* --- Loading & Error State --- */
        .loading-container {
            text-align: center; padding: 50px 20px; color: var(--text-sub);
        }
        .spinner {
            border: 4px solid #f3f3f3; border-top: 4px solid var(--accent);
            border-radius: 50%; width: 40px; height: 40px;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .retry-btn {
            background: var(--accent); color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; margin-top: 15px; display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Shopping List</h1>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="ค้นหา...">
        </div>
    </div>

    <div class="container" id="listContainer">
        <div class="loading-container" id="loadingState">
            <div class="spinner"></div>
            <div id="loadingText">Connecting to data source...</div>
            <button class="retry-btn" id="retryBtn" onclick="location.reload()">โหลดใหม่ (Retry)</button>
        </div>
    </div>

    <div class="modal" id="groupModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="mTitle" class="modal-title">Product Name</h2>
                <div class="close-btn" onclick="closeModalDirect()"><i class="fas fa-times"></i></div>
            </div>
            <div class="modal-body" id="mBody"></div>
        </div>
    </div>

    <div class="modal img-viewer-modal" id="imageViewerModal" onclick="closeImageViewer(event)">
        <span class="close-btn-img" onclick="closeImageViewerDirect()">&times;</span>
        <img class="modal-full-img" id="fullImage" src="">
    </div>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSsNmpYBJTnOp4Wa3lQy3VeTolxfSHKzRaXXGnM2k_C8iq0hYC4MlLLqSIb12Ml8fDDw6AhPp6ePFds/pub?gid=219602649&single=true&output=csv';
        const RATE = 0.215;

        let allProducts = [];
        let loadTimer;

        function init() {
            const loadText = document.getElementById('loadingText');
            const retryBtn = document.getElementById('retryBtn');
            
            // ตั้งเวลา Alert ถ้าโหลดช้าเกิน 10 วิ
            loadTimer = setTimeout(() => {
                loadText.innerHTML = "โหลดนานกว่าปกติ<br>กรุณาตรวจสอบอินเทอร์เน็ต";
                retryBtn.style.display = "inline-block";
            }, 10000);

            if(sheetUrl.includes('google') || sheetUrl.includes('http')) {
                loadText.innerText = "Downloading data...";
                
                // Cache Busting
                const bustUrl = sheetUrl + '&t=' + Date.now();

                Papa.parse(bustUrl, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    worker: false, // ปิด Worker สำหรับ Github Pages
                    complete: function(results) {
                        clearTimeout(loadTimer);
                        loadText.innerText = "Processing...";
                        
                        allProducts = results.data.filter(item => item.Name && item.Name.trim() !== '');
                        
                        if (allProducts.length === 0) {
                            loadText.innerText = "ไม่พบข้อมูลในตาราง (Empty Sheet)";
                            retryBtn.style.display = "inline-block";
                        } else {
                            renderGroupedList(allProducts);
                        }
                    },
                    error: (err) => {
                        clearTimeout(loadTimer);
                        console.error("CSV Error:", err);
                        loadText.innerHTML = "เกิดข้อผิดพลาดในการเชื่อมต่อ<br>Google Sheets";
                        retryBtn.style.display = "inline-block";
                    }
                });
            } else {
                clearTimeout(loadTimer);
                loadText.innerHTML = "URL ไม่ถูกต้อง";
            }
        }

        function renderGroupedList(products) {
            const container = document.getElementById('listContainer');
            container.innerHTML = ''; 
            
            const groupedByLoc = products.reduce((acc, item) => {
                const loc = item.Location ? item.Location.trim() : 'General';
                if (!acc[loc]) acc[loc] = [];
                acc[loc].push(item);
                return acc;
            }, {});

            Object.keys(groupedByLoc).sort().forEach(location => {
                const header = document.createElement('div');
                header.className = 'group-header';
                header.innerHTML = location;
                container.appendChild(header);
                
                const itemsInLoc = groupedByLoc[location];
                const groupedByName = itemsInLoc.reduce((acc, item) => {
                    const name = item.Name.trim();
                    if (!acc[name]) acc[name] = [];
                    acc[name].push(item);
                    return acc;
                }, {});

                Object.keys(groupedByName).forEach(name => {
                    const items = groupedByName[name];
                    const count = items.length;
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.onclick = () => openGroupModal(name, items);
                    card.innerHTML = `
                        <span class="item-name">${name}</span>
                        ${count > 1 ? `<span class="item-count">${count} items</span>` : '<span style="color:#ddd;"><i class="fas fa-chevron-right"></i></span>'}
                    `;
                    container.appendChild(card);
                });
            });
        }

        window.openGroupModal = (title, items) => {
            document.getElementById('mTitle').innerText = title;
            const body = document.getElementById('mBody');
            body.innerHTML = ''; 

            items.forEach(item => {
                let imgUrl = item.Image_URL;
                if(!imgUrl || imgUrl.trim() === '') imgUrl = 'https://via.placeholder.com/150?text=No+Img';
                
                let badgesHtml = '';
                if(item.Description) {
                    const badges = item.Description.split(',').map(s => s.trim()).filter(s => s!=='');
                    badges.forEach(b => badgesHtml += `<span class="badge">${b}</span>`);
                } else {
                    badgesHtml = `<span class="badge" style="background:transparent; padding-left:0; color:#ccc;">No description</span>`;
                }

                // 💰 Price Logic Updated (Full Option: Inc Vat & No Vat + THB)
                let priceHtml = '';
                if (item.JPY) {
                    const jpyVal = parseFloat(item.JPY.replace(/,/g, ''));
                    if (!isNaN(jpyVal)) {
                        // 1. Calculate Standard Price (Inc Vat)
                        const thbVal = Math.round(jpyVal * RATE);
                        const thbStr = thbVal.toLocaleString('en-US');

                        // 2. Calculate No Vat (JPY / 1.1)
                        const noVatVal = Math.round(jpyVal / 1.1);
                        const noVatStr = noVatVal.toLocaleString('en-US');

                        // 3. Calculate No Vat THB
                        const noVatThbVal = Math.round(noVatVal * RATE);
                        const noVatThbStr = noVatThbVal.toLocaleString('en-US');

                        // 4. Assemble HTML
                        priceHtml = `
                            ¥${item.JPY} 
                            <span class="thb-price">(฿${thbStr})</span>
                            <span class="no-vat-price">(No Vat: ¥${noVatStr} / ฿${noVatThbStr})</span>
                        `;
                    } else {
                        priceHtml = `¥${item.JPY}`;
                    }
                }

                // Remark Finder
                let remarkText = '';
                const keys = Object.keys(item);
                const targetKey = keys.find(k => k.toLowerCase().trim().includes('remark'));
                if (targetKey && item[targetKey]) {
                    remarkText = item[targetKey].trim();
                }

                let remarkHtml = '';
                if (remarkText !== '') {
                    remarkHtml = `
                        <div class="remark-container">
                            <span class="remark-badge">
                                <i class="fas fa-comment-dots"></i> ${remarkText}
                            </span>
                        </div>
                    `;
                }

                const row = document.createElement('div');
                row.className = 'variant-item';
                row.innerHTML = `
                    <div class="variant-img-box">
                        <img src="${imgUrl}" class="variant-img" 
                             onerror="this.src='https://via.placeholder.com/150?text=Err'"
                             onclick="openImageViewer('${imgUrl}')">
                    </div>
                    <div class="variant-info">
                        <div class="badge-container">${badgesHtml}</div>
                        <div class="variant-price">${priceHtml}</div>
                        ${remarkHtml}
                    </div>
                `;
                body.appendChild(row);
            });

            document.getElementById('groupModal').classList.add('active');
        }

        window.closeModal = (e) => { 
            if(e.target.id === 'groupModal') document.getElementById('groupModal').classList.remove('active'); 
        }
        window.closeModalDirect = () => document.getElementById('groupModal').classList.remove('active');

        window.openImageViewer = (src) => {
            if(src.includes('via.placeholder.com')) return;
            const imgModal = document.getElementById('imageViewerModal');
            const fullImg = document.getElementById('fullImage');
            fullImg.src = src;
            imgModal.classList.add('active');
        }
        window.closeImageViewer = (e) => { 
            if(e.target.id === 'imageViewerModal') document.getElementById('imageViewerModal').classList.remove('active'); 
        }
        window.closeImageViewerDirect = () => document.getElementById('imageViewerModal').classList.remove('active');

        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => (p.Name && p.Name.toLowerCase().includes(term)));
            renderGroupedList(filtered);
        });

        init();
    </script>
</body>
</html>
