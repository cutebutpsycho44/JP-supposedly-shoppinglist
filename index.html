<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shopping List</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === Clean & Minimal Palette === */
        :root {
            --bg-color: #FAFAFA; /* พื้นหลังขาวนวล */
            --card-bg: #FFFFFF;
            --text-main: #333333;
            --text-sub: #757575;
            --accent: #8D6E63; /* น้ำตาลสุภาพ */
            --border: #E0E0E0;
            --tag-bg: #F5F5F5;
        }

        body {
            font-family: 'Sarabun', sans-serif; /* ฟอนต์ใหม่ */
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 50px;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Header เรียบๆ --- */
        .header {
            background: var(--card-bg);
            padding: 20px 25px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .header h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* --- Search Bar --- */
        .search-container { margin-top: 15px; }
        .search-box {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Sarabun';
            font-size: 0.95rem;
            background: #F9F9F9;
            outline: none;
            box-sizing: border-box;
        }
        .search-box:focus { background: #fff; border-color: var(--accent); }

        /* --- Main List Container --- */
        .container { max-width: 600px; margin: 20px auto; padding: 0 20px; }

        .group-header {
            margin-top: 30px;
            margin-bottom: 10px;
            color: var(--text-sub);
            font-weight: 500;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        /* --- Product Card (Grouped) --- */
        .item-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .item-card:active { background-color: #F5F5F5; }

        .item-name {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
        }
        .item-count {
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 400;
        }

        /* --- Modal Styling (Redesigned) --- */
        .modal {
            display: none;
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); /* Dim Background */
            z-index: 1000;
            justify-content: center;
            align-items: center; /* Center on Desktop */
            padding: 20px;
            box-sizing: border-box;
            backdrop-filter: blur(3px);
        }
        .modal.active { display: flex; }

        .modal-content {
            background: var(--card-bg);
            width: 100%; max-width: 500px;
            max-height: 85vh;
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        /* Modal Header */
        .modal-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }
        .modal-title {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
        }
        
        /* ปุ่มปิดแบบใหม่ */
        .close-btn {
            background: #F0F0F0;
            border: none;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: #555;
            font-size: 1rem;
            transition: background 0.2s;
        }
        .close-btn:hover { background: #E0E0E0; }

        /* Modal Body (Scrollable List) */
        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        /* Variant Item Styling inside Modal */
        .variant-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
        }
        .variant-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        /* Image Wrapper */
        .variant-img-box {
            width: 80px; height: 80px;
            flex-shrink: 0;
            background: #f9f9f9;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .variant-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Variant Info */
        .variant-info { flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-start; }
        
        /* Badge Wrapper */
        .badge-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }
        .badge {
            font-size: 0.8rem;
            background: var(--tag-bg);
            color: #555;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .variant-price {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent);
            margin-top: auto; /* Push to bottom */
        }

        .loading { text-align: center; padding: 50px; color: var(--text-sub); }
    </style>
</head>
<body>

    <div class="header">
        <h1>Shopping List</h1>
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" placeholder="ค้นหา...">
        </div>
    </div>

    <div class="container" id="listContainer">
        <div class="loading" id="loading">Loading data...</div>
    </div>

    <div class="modal" id="groupModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 id="mTitle" class="modal-title">Product Name</h2>
                <div class="close-btn" onclick="closeModalDirect()"><i class="fas fa-times"></i></div>
            </div>
            
            <div class="modal-body" id="mBody">
                </div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 👇 วางลิงก์ CSV ตรงนี้เหมือนเดิม
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSsNmpYBJTnOp4Wa3lQy3VeTolxfSHKzRaXXGnM2k_C8iq0hYC4MlLLqSIb12Ml8fDDw6AhPp6ePFds/pub?gid=219602649&single=true&output=csv';
        // -------------------------------------------------------------

        let allProducts = [];

        function init() {
            if(sheetUrl.includes('google') || sheetUrl.includes('http')) {
                Papa.parse(sheetUrl, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: function(results) {
                        allProducts = results.data.filter(item => item.Name && item.Name.trim() !== '');
                        renderGroupedList(allProducts);
                    },
                    error: (err) => document.getElementById('loading').innerHTML = "Error loading data."
                });
            } else {
                document.getElementById('loading').innerHTML = "Please set CSV link.";
            }
        }

        function renderGroupedList(products) {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';

            // 1. Group by Location First
            const groupedByLoc = products.reduce((acc, item) => {
                const loc = item.Location ? item.Location.trim() : 'General';
                if (!acc[loc]) acc[loc] = [];
                acc[loc].push(item);
                return acc;
            }, {});

            // 2. Loop Location
            Object.keys(groupedByLoc).sort().forEach(location => {
                const header = document.createElement('div');
                header.className = 'group-header';
                header.innerHTML = location;
                container.appendChild(header);

                // 3. Group by Name inside Location (จับชื่อเหมือนกันมารวมกัน)
                const itemsInLoc = groupedByLoc[location];
                const groupedByName = itemsInLoc.reduce((acc, item) => {
                    const name = item.Name.trim();
                    if (!acc[name]) acc[name] = [];
                    acc[name].push(item);
                    return acc;
                }, {});

                // 4. Create Cards
                Object.keys(groupedByName).forEach(name => {
                    const items = groupedByName[name]; // อาร์เรย์ของสินค้าที่มีชื่อเหมือนกัน
                    const count = items.length;
                    
                    const card = document.createElement('div');
                    card.className = 'item-card';
                    // คลิกที่การ์ดแล้วส่งรายการย่อยทั้งหมดไปที่ Modal
                    card.onclick = () => openGroupModal(name, items);

                    card.innerHTML = `
                        <span class="item-name">${name}</span>
                        ${count > 1 ? `<span class="item-count">${count} items</span>` : '<span style="color:#ddd;"><i class="fas fa-chevron-right"></i></span>'}
                    `;
                    container.appendChild(card);
                });
            });
        }

        // --- Logic ใหม่ของ Modal ---
        window.openGroupModal = (title, items) => {
            document.getElementById('mTitle').innerText = title;
            const body = document.getElementById('mBody');
            body.innerHTML = ''; // Clear old content

            items.forEach(item => {
                // Prepare Image
                let imgUrl = item.Image_URL;
                if(!imgUrl || imgUrl.trim() === '') imgUrl = 'https://via.placeholder.com/150?text=No+Img';
                
                // Prepare Badges (Description)
                let badgesHtml = '';
                if(item.Description) {
                    const badges = item.Description.split(',').map(s => s.trim()).filter(s => s!=='');
                    badges.forEach(b => {
                        badgesHtml += `<span class="badge">${b}</span>`;
                    });
                } else {
                    badgesHtml = `<span class="badge" style="background:transparent; padding-left:0; color:#ccc;">No description</span>`;
                }

                // Prepare Price
                const priceHtml = item.JPY ? `¥${item.JPY}` : '';

                // Create Row HTML
                const row = document.createElement('div');
                row.className = 'variant-item';
                row.innerHTML = `
                    <div class="variant-img-box">
                        <img src="${imgUrl}" class="variant-img" onerror="this.src='https://via.placeholder.com/150?text=Err'">
                    </div>
                    <div class="variant-info">
                        <div class="badge-container">${badgesHtml}</div>
                        <div class="variant-price">${priceHtml}</div>
                    </div>
                `;
                body.appendChild(row);
            });

            document.getElementById('groupModal').classList.add('active');
        }

        window.closeModal = (e) => { 
            if(e.target.id === 'groupModal') document.getElementById('groupModal').classList.remove('active'); 
        }
        window.closeModalDirect = () => document.getElementById('groupModal').classList.remove('active');

        // Search Logic
        document.getElementById('searchInput').addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => (p.Name && p.Name.toLowerCase().includes(term)));
            renderGroupedList(filtered);
        });

        init();
    </script>
</body>
</html>
