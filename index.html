        /* === Clean & Minimal Palette === */
        :root {
            --bg-color: #FAFAFA;
            --card-bg: #FFFFFF;

            --text-sub: #757575;
            --accent: #8D6E63;
            --border: #E0E0E0;
            --tag-bg: #F5F5F5;
        }

            font-family: 'Sarabun', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 50px;
            -webkit-tap-highlight-color: transparent;
        }

            position: sticky;
            top: 0;
            z-index: 100;
